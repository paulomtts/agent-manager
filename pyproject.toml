[project]
name = "agent-manager"
version = "0.1.0"
description = "Program-driven workflow engine that dispatches AI harness instances against a brd board."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paulo Mattos" }]
keywords = ["cli", "ai-agents", "orchestration", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.2",
    "pydantic>=2.9",
    "pygents>=0.7.0",
    "grafo>=0.3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
am = "agent_manager.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: slow, opt-in, costs real money -- drives the toy card against the real `claude` on PATH. Excluded by the `-m \"not e2e\"` in addopts; run it with `uv run pytest -m e2e` (a bare path invocation is still deselected, so pass `-m e2e` alongside any path).",
]
# importlib mode, not the default prepend mode: tests/steps/test_integrate.py and
# tests/e2e/test_integrate.py share a basename, and prepend mode names test modules
# after their basename alone, so collecting both aborts with "import file mismatch".
# `-m "not e2e"` keeps the paid real-harness test out of the default suite; a `-m`
# passed on the command line overrides this one, which is how `-m e2e` selects it.
addopts = "--import-mode=importlib -m \"not e2e\""
# importlib mode puts nothing on sys.path, so shared test helpers that are not
# fixtures (tests/lockhelpers.py) are importable only through this entry.
pythonpath = ["tests"]
