[project]
name = "agent-manager"
version = "0.1.0"
description = "Program-driven workflow engine that dispatches AI harness instances against a brd board."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.2",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
agent-manager = "agent_manager.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_manager"]
