name: task
description: Drive one subtask card end to end in its own worktree.

phases:
  - name: worktree
    kind: deterministic
    run: worktree.ensure

  - name: explore
    kind: agent
    role: explorer
    inputs: [card, parent_story, repo_docs, verification]
    result: ExploreResult
    gates: [exploration_output_gate, verification_gate]
    retry: { max_attempts: 2, on: [schema_invalid, gate_failed] }

  - name: mark_in_progress
    kind: deterministic
    run: rollup.set_status
    args: { status: in_progress }
    best_effort: true

  - name: plan_check
    kind: deterministic
    run: plan_check.find_validated_plan
    skip_to: implement
    when: plan_check.has_validated_plan

  - name: spec
    kind: agent
    role: spec_author
    inputs: [card, explore, spec_path]
    result: SpecResult
    writes: docs/superpowers/specs/{stem}.md

  - name: validate_spec
    kind: agent
    role: critic
    inputs: [card, spec_path]
    result: CriticResult
    gates: [critic_blockers_gate]

  - name: plan
    kind: agent
    role: planner
    inputs: [spec_path, plan_path]
    result: PlanResult
    writes: docs/superpowers/plans/{stem}.md

  - name: validate_plan
    kind: agent
    role: critic
    inputs: [spec_path, plan_path]
    result: CriticResult
    gates: [critic_blockers_gate]

  - name: mark_validated
    kind: deterministic
    run: plan_check.mark_validated

  - name: implement
    kind: agent
    role: coder
    inputs: [plan_path, spec_path, branch, base_branch]
    result: ImplementResult

  - name: review
    kind: agent
    role: reviewer
    inputs: [branch, base_branch, plan_path]
    result: ReviewResult
    gates: [review_gate, plan_hash_gate]

  - name: verify
    kind: deterministic
    run: verify.run_suite
    gates: [verification_passed_gate]

  - name: mark_done
    kind: deterministic
    run: rollup.set_status
    args: { status: done }
    best_effort: true
